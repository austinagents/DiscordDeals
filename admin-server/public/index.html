<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  />

  <title>Partnerlinks Admin</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #0d0e12;
      --panel: #15171d;
      --panel2: #1a1c23;
      --border: #2a2d36;
      --text: #f6f7fb;
      --muted: #9b9eaa;
      --purple: #6962ff;
      --green: #66df9d;
      --red: #ff5c67;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
    }

    .login-card {
      width: min(440px,100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 34px;
      text-align: center;
    }

    .eyebrow {
      font-size: 12px;
      letter-spacing: .18em;
      color: var(--muted);
      font-weight: 800;
    }

    h1,
    h2,
    h3,
    p {
      margin-top: 0;
    }

    .primary,
    .secondary,
    .danger {
      border: 0;
      border-radius: 11px;
      min-height: 42px;
      padding: 0 16px;
      font-weight: 750;
    }

    .primary {
      background: var(--purple);
      color: white;
    }

    .secondary {
      background: var(--panel2);
      border: 1px solid var(--border);
      color: var(--text);
    }

    .danger {
      background: rgba(255,92,103,.13);
      color: var(--red);
      border: 1px solid rgba(255,92,103,.25);
    }

    .shell {
      width: min(1450px, calc(100% - 40px));
      margin: 0 auto;
      padding-bottom: 60px;
    }

    .topbar {
      min-height: 86px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      margin-bottom: 30px;
    }

    .topbar h1 {
      margin: 3px 0 0;
      font-size: 25px;
    }

    .top-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .user {
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      align-items: center;
      margin-bottom: 22px;
    }

    .toolbar h2 {
      margin: 0;
      font-size: 34px;
    }

    .toolbar p {
      margin: 7px 0 0;
      color: var(--muted);
    }

    .products {
      display: grid;
      gap: 10px;
    }

    .product {
      display: grid;
      grid-template-columns:
        76px minmax(200px,1.4fr)
        1fr 130px 110px;
      gap: 16px;
      align-items: center;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 15px;
      padding: 11px;
    }

    .product img {
      width: 76px;
      height: 76px;
      object-fit: cover;
      border-radius: 11px;
      background: white;
    }

    .product-name {
      font-weight: 800;
      font-size: 16px;
    }

    .product-sub,
    .metrics {
      color: var(--muted);
      font-size: 13px;
      margin-top: 5px;
    }

    .status {
      font-size: 12px;
      font-weight: 800;
      color: var(--muted);
    }

    .status.active {
      color: var(--green);
    }

    .editor-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.72);
      display: grid;
      place-items: center;
      padding: 24px;
      z-index: 10;
    }

    .editor {
      width: min(900px,100%);
      max-height: calc(100vh - 48px);
      overflow: auto;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 22px;
      padding: 26px;
    }

    .editor-head {
      display: flex;
      justify-content: space-between;
      gap: 20px;
      align-items: center;
      margin-bottom: 22px;
    }

    .editor-head h2 {
      margin: 0;
    }

    .close {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--panel2);
      color: white;
      font-size: 22px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .field {
      display: grid;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    .field span {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    input,
    select,
    textarea {
      width: 100%;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: #111319;
      color: white;
      padding: 12px;
      outline: none;
    }

    textarea {
      min-height: 105px;
      resize: vertical;
    }

    .toggle {
      display: flex;
      gap: 10px;
      align-items: center;
      min-height: 46px;
    }

    .toggle input {
      width: auto;
    }

    .actions {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 22px;
    }

    .action-right {
      display: flex;
      gap: 10px;
    }

    .notice {
      color: var(--muted);
      padding: 20px 0;
    }

    @media (max-width: 850px) {
      .product {
        grid-template-columns:
          64px 1fr auto;
      }

      .product .metrics,
      .product .status {
        display: none;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .field.full {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>

  <section
    id="login"
    class="login hidden"
  >
    <div class="login-card">
      <div class="eyebrow">
        PARTNERLINKS
      </div>

      <h1>
        Admin
      </h1>

      <p style="color:var(--muted)">
        Manage everything creators see
        in Creator Deals.
      </p>

      <button
        class="primary"
        onclick="
          location.href=
            '/admin-auth/login'
        "
      >
        Sign in with Discord
      </button>
    </div>
  </section>


  <main
    id="app"
    class="shell hidden"
  >

    <header class="topbar">
      <div>
        <div class="eyebrow">
          PARTNERLINKS
        </div>

        <h1>
          Admin
        </h1>
      </div>

      <div class="top-actions">
        <span
          id="user"
          class="user"
        ></span>

        <button
          class="secondary"
          id="logout"
        >
          Sign Out
        </button>
      </div>
    </header>


    <section class="toolbar">
      <div>
        <h2>
          Creator Deals
        </h2>

        <p>
          Products published to the
          Discord creator experience.
        </p>
      </div>

      <button
        class="primary"
        id="add"
      >
        + Add Product
      </button>
    </section>


    <div
      id="products"
      class="products"
    ></div>

  </main>


  <div
    id="editorBackdrop"
    class="editor-backdrop hidden"
  >

    <section class="editor">

      <div class="editor-head">
        <h2 id="editorTitle">
          Add Product
        </h2>

        <button
          id="close"
          class="close"
        >
          ×
        </button>
      </div>


      <div class="grid">

        <label class="field">
          <span>Product Name</span>
          <input id="name" />
        </label>

        <label class="field">
          <span>Brand</span>
          <input id="brand" />
        </label>

        <label class="field">
          <span>Category</span>

          <select id="category">
            <option>Fashion</option>
            <option>Food</option>
            <option>Sports</option>
            <option>Home</option>
            <option>Beauty</option>
            <option>Tech</option>
            <option>Other</option>
          </select>
        </label>

        <label class="field">
          <span>Commission</span>
          <input
            id="commission"
            placeholder="15%"
          />
        </label>

        <label class="field">
          <span>Shop Ads</span>
          <input
            id="shopAds"
            placeholder="5% or —"
          />
        </label>

        <label class="field">
          <span>Free Sample</span>
          <input
            id="freeSample"
            placeholder="Auto-Approved"
          />
        </label>

        <label class="field full">
          <span>Requirements</span>
          <input
            id="requirements"
            placeholder="1 TikTok Shoppable Video"
          />
        </label>

        <label class="field full">
          <span>Brand Website</span>
          <input
            id="website"
            placeholder="https://..."
          />
        </label>

        <label class="field full">
          <span>Description</span>
          <textarea id="description"></textarea>
        </label>

        <label class="field full">
          <span>
            Product Image
          </span>

          <input
            id="image"
            type="file"
            accept="image/*"
          />
        </label>

        <label class="toggle full">
          <input
            id="active"
            type="checkbox"
          />

          <span>
            Product is active and visible
            to creators
          </span>
        </label>

      </div>


      <div class="actions">

        <button
          id="delete"
          class="danger"
        >
          Delete Product
        </button>

        <div class="action-right">

          <button
            id="cancel"
            class="secondary"
          >
            Cancel
          </button>

          <button
            id="save"
            class="primary"
          >
            Save Product
          </button>

        </div>

      </div>

    </section>
  </div>


<script>
  let products = [];
  let editingId = null;

  const $ =
    id =>
      document.getElementById(id);

  async function request(
    url,
    options = {}
  ) {
    const response =
      await fetch(
        url,
        {
          ...options,
          credentials: "same-origin"
        }
      );

    const text =
      await response.text();

    let data = null;

    try {
      data =
        text
          ? JSON.parse(text)
          : null;
    } catch {
      data = {
        error: text
      };
    }

    if (!response.ok) {
      throw Object.assign(
        new Error(
          data?.error ||
          "Request failed"
        ),
        {
          status:
            response.status
        }
      );
    }

    return data;
  }


  async function boot() {
    try {
      const auth =
        await request(
          "/admin-auth/me"
        );

      $("login")
        .classList
        .add("hidden");

      $("app")
        .classList
        .remove("hidden");

      $("user").textContent =
        auth.user.username;

      await loadProducts();

    } catch (error) {
      if (
        error.status === 401
      ) {
        $("app")
          .classList
          .add("hidden");

        $("login")
          .classList
          .remove("hidden");

        return;
      }

      alert(error.message);
    }
  }


  async function loadProducts() {
    products =
      await request(
        "/admin-api/products"
      );

    renderProducts();
  }


  function renderProducts() {
    const root =
      $("products");

    root.innerHTML = "";

    if (!products.length) {
      root.innerHTML =
        '<div class="notice">No products yet.</div>';

      return;
    }

    products.forEach(
      product => {
        const row =
          document.createElement(
            "div"
          );

        row.className =
          "product";

        const image =
          document.createElement(
            "img"
          );

        image.src =
          `/api/products/${encodeURIComponent(
            product.id
          )}/image`;

        const main =
          document.createElement(
            "div"
          );

        main.innerHTML =
          `<div class="product-name"></div>
           <div class="product-sub"></div>`;

        main.querySelector(
          ".product-name"
        ).textContent =
          product.name;

        main.querySelector(
          ".product-sub"
        ).textContent =
          `${product.brand} • ${product.category}`;

        const metrics =
          document.createElement(
            "div"
          );

        metrics.className =
          "metrics";

        metrics.textContent =
          `${product.commission} commission` +
          (
            product.shop_ads &&
            product.shop_ads !== "—"
              ? ` • ${product.shop_ads} Shop Ads`
              : ""
          );

        const status =
          document.createElement(
            "div"
          );

        status.className =
          product.active
            ? "status active"
            : "status";

        status.textContent =
          product.active
            ? "ACTIVE"
            : "DISABLED";

        const edit =
          document.createElement(
            "button"
          );

        edit.className =
          "secondary";

        edit.textContent =
          "Edit";

        edit.onclick =
          () =>
            openEditor(
              product
            );

        row.append(
          image,
          main,
          metrics,
          status,
          edit
        );

        root.append(row);
      }
    );
  }


  function openEditor(product = null) {
    editingId =
      product?.id || null;

    $("editorTitle")
      .textContent =
        editingId
          ? "Edit Product"
          : "Add Product";

    $("name").value =
      product?.name || "";

    $("brand").value =
      product?.brand || "";

    $("category").value =
      product?.category ||
      "Fashion";

    $("commission").value =
      product?.commission || "";

    $("shopAds").value =
      product?.shop_ads === "—"
        ? ""
        : product?.shop_ads || "";

    $("freeSample").value =
      product?.free_sample ||
      "Auto-Approved";

    $("requirements").value =
      product?.requirements ||
      "1 TikTok Shoppable Video";

    $("website").value =
      product?.brand_website || "";

    $("description").value =
      product?.description || "";

    $("active").checked =
      product
        ? Boolean(product.active)
        : true;

    $("image").value = "";

    $("delete")
      .classList
      .toggle(
        "hidden",
        !editingId
      );

    $("editorBackdrop")
      .classList
      .remove("hidden");
  }


  function closeEditor() {
    $("editorBackdrop")
      .classList
      .add("hidden");

    editingId = null;
  }


  async function saveProduct() {
    if (
      !$("name").value.trim() ||
      !$("brand").value.trim()
    ) {
      alert(
        "Product name and brand are required."
      );

      return;
    }

    const data =
      new FormData();

    data.append(
      "name",
      $("name").value.trim()
    );

    data.append(
      "brand",
      $("brand").value.trim()
    );

    data.append(
      "category",
      $("category").value
    );

    data.append(
      "commission",
      $("commission").value.trim()
    );

    data.append(
      "shop_ads",
      $("shopAds").value.trim()
    );

    data.append(
      "free_sample",
      $("freeSample").value.trim()
    );

    data.append(
      "requirements",
      $("requirements").value.trim()
    );

    data.append(
      "brand_website",
      $("website").value.trim()
    );

    data.append(
      "description",
      $("description").value.trim()
    );

    data.append(
      "active",
      String(
        $("active").checked
      )
    );

    if (
      $("image")
        .files[0]
    ) {
      data.append(
        "image",
        $("image").files[0]
      );
    }

    $("save").disabled = true;

    try {
      if (editingId) {
        await request(
          `/admin-api/products/${encodeURIComponent(
            editingId
          )}`,
          {
            method: "PUT",
            body: data
          }
        );

      } else {
        await request(
          "/admin-api/products",
          {
            method: "POST",
            body: data
          }
        );
      }

      closeEditor();

      await loadProducts();

    } catch (error) {
      alert(error.message);

    } finally {
      $("save").disabled = false;
    }
  }


  async function deleteProduct() {
    if (!editingId) return;

    const product =
      products.find(
        item =>
          item.id === editingId
      );

    if (
      !confirm(
        `Delete ${product?.name || "this product"}?`
      )
    ) {
      return;
    }

    await request(
      `/admin-api/products/${encodeURIComponent(
        editingId
      )}`,
      {
        method: "DELETE"
      }
    );

    closeEditor();

    await loadProducts();
  }


  $("add").onclick =
    () => openEditor();

  $("close").onclick =
    closeEditor;

  $("cancel").onclick =
    closeEditor;

  $("save").onclick =
    saveProduct;

  $("delete").onclick =
    deleteProduct;

  $("logout").onclick =
    async () => {
      await request(
        "/admin-auth/logout",
        {
          method: "POST"
        }
      );

      location.reload();
    };

  boot();
</script>

</body>
</html>
